# fly.toml app configuration file generated for flowgate-pramathesh on 2026-09-11T13:52:48-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flowgate-pramathesh'
primary_region = 'sjc'

[build]

[env]
  # Fly's edge overwrites Fly-Client-IP on every request, so it is safe
  # to key per-client limits on it here and nowhere else.
  TRUST_FLY_CLIENT_IP = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
