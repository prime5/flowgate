# Runs flowgate itself as three pods: the same binary whose
# in-process sync pool models a Kubernetes replica set. Labels mark
# it as the load-and-fault playground.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgate
  labels:
    app: flowgate
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flowgate
  template:
    metadata:
      labels:
        app: flowgate
    spec:
      containers:
      - name: flowgate
        # Built locally and loaded into kind by scripts/ephemeral-env.sh.
        # For a real cluster, push and reference a registry image
        # (e.g. ghcr.io/prime5/flowgate:resilience-experiments).
        image: flowgate:resilience-experiments
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        # Each pod runs its own in-process sync pool; this is the
        # replica count the pod-kill experiment plays with.
        - name: SYNC_REPLICAS
          value: "2"
        - name: SYNC_WORK_MS
          value: "25"
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flowgate
  labels:
    app: flowgate
spec:
  selector:
    app: flowgate
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
