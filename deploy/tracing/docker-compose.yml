# Local trace backend for flowgate: Jaeger all-in-one.
#   UI:        http://localhost:16686
#   OTLP/HTTP: http://localhost:4318   (what flowgate exports to)
#
# Run:  docker compose -f deploy/tracing/docker-compose.yml up -d
# Then: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 PORT=8080 ./flowgate
services:
  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
