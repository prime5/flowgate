events {
    worker_connections 1024;
}

http {
    upstream flowgate_cluster {
        server flowgate-1:8080;
        server flowgate-2:8080;
        server flowgate-3:8080;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://flowgate_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Forward Fly-Client-IP header for flowgate per-client keying
            proxy_set_header Fly-Client-IP $http_fly_client_ip;
        }
    }
}
