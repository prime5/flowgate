services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  flowgate-1:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - REDIS_ADDR=${REDIS_ADDR-redis:6379}
      - RL_BURST=${RL_BURST:-20}
      - RL_RATE=${RL_RATE:-5}
      - FLOWGATE_LAB=1
      # Lab only: nginx forwards the client-supplied Fly-Client-IP and the
      # k6 load test sets a distinct one per virtual user, so per-client
      # keys need this on. Never enable it where clients reach flowgate
      # directly: they could rotate the header to evade the limit.
      - TRUST_FLY_CLIENT_IP=1
    depends_on:
      - redis

  flowgate-2:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - REDIS_ADDR=${REDIS_ADDR-redis:6379}
      - RL_BURST=${RL_BURST:-20}
      - RL_RATE=${RL_RATE:-5}
      - FLOWGATE_LAB=1
      # Lab only: nginx forwards the client-supplied Fly-Client-IP and the
      # k6 load test sets a distinct one per virtual user, so per-client
      # keys need this on. Never enable it where clients reach flowgate
      # directly: they could rotate the header to evade the limit.
      - TRUST_FLY_CLIENT_IP=1
    depends_on:
      - redis

  flowgate-3:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - REDIS_ADDR=${REDIS_ADDR-redis:6379}
      - RL_BURST=${RL_BURST:-20}
      - RL_RATE=${RL_RATE:-5}
      - FLOWGATE_LAB=1
      # Lab only: nginx forwards the client-supplied Fly-Client-IP and the
      # k6 load test sets a distinct one per virtual user, so per-client
      # keys need this on. Never enable it where clients reach flowgate
      # directly: they could rotate the header to evade the limit.
      - TRUST_FLY_CLIENT_IP=1
    depends_on:
      - redis

  proxy:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flowgate-1
      - flowgate-2
      - flowgate-3
